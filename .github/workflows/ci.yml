name: CI

# Corre en cada push y en cada Pull Request — el objetivo es enterarnos de que algo
# rompió ANTES de que llegue a producción, no después. No hace falta ninguna credencial
# (Firebase/Sentry) para este chequeo: tipos, lint y que el build compile alcanzan.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  chequeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      # El build de Next.js corre TypeScript como parte del proceso (genera antes los
      # tipos de rutas en .next/types/, de los que dependen tipos como LayoutProps).
      # Un chequeo de tipos separado ANTES del build fallaría porque esos tipos todavía
      # no existirían.
      - name: Build (Next.js, incluye chequeo de tipos)
        run: npm run build
