name: CI

# Corre en cada push y en cada Pull Request — el objetivo es enterarnos de que algo
# rompió ANTES de que llegue a producción, no después. No hace falta ninguna credencial
# (Firebase/Sentry) para este chequeo: tipos, lint y que el build compile alcanzan.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  chequeo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (Next.js)
        run: npm run build
